# Nginx раздаёт собранное Vite/React-приложение из /usr/share/nginx/html.
# start.sh создаёт env.js перед запуском сервера: образ приложения общий
# для всех контуров, а публичная конфигурация задаётся при старте контейнера.
# Справочник: https://nginx.org/en/docs/

# Пользователь рабочих процессов; master-процесс запускается отдельно.
user nginx;
# Число рабочих процессов выбирается автоматически по доступным CPU.
worker_processes auto;

# Ошибки уровня notice и выше. В официальном образе лог связан со stderr.
error_log /var/log/nginx/error.log notice;
# Файл с идентификатором master-процесса.
pid /run/nginx.pid;


events {
	# Максимальное число одновременных соединений на один рабочий процесс.
	# Это число соединений, а не запросов в секунду.
	worker_connections 1024;
}


http {
	# Соответствие расширений файлов MIME-типам: .js, .css, .html и т. д.
	include /etc/nginx/mime.types;
	# Тип ответа для расширений, отсутствующих в mime.types.
	default_type application/octet-stream;

	# Сжимаем подходящие ответы, если клиент поддерживает gzip.
	gzip on;

	# Vary: Accept-Encoding позволяет кешам различать сжатые и обычные ответы.
	gzip_vary on;
	# Разрешаем сжатие и для запросов с Via (прошедших через прокси).
	gzip_proxied any;
	# Уровень 1–9: 9 даёт максимальное сжатие ценой большей нагрузки на CPU.
	gzip_comp_level 9;
	# До 16 буферов по 8 КиБ для сжатия одного ответа.
	gzip_buffers 16 8k;
	# Минимальная версия HTTP запроса для применения gzip.
	gzip_http_version 1.1;
	# Дополнительные MIME-типы для сжатия; text/html сжимается и без списка.
	gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


	server {

		# HTTP на порту 80 для IPv4 и IPv6 внутри контейнера.
		# Внешние порты задаются отдельно, например в docker-compose.yaml.
		listen 80;
		listen [::]:80;

		# Журнал запросов; в официальном образе этот путь связан со stdout.
		access_log /var/log/nginx/host.access.log;

		# Каталог сборки, скопированный из dist на этапе сборки Docker-образа.
		root /usr/share/nginx/html;
		# Файл, который отдаётся при обращении к каталогу.
		index index.html;

		# Заголовки для браузера. always добавляет их также к ответам с ошибками.
		# По умолчанию собственный add_header в location отменяет наследование
		# ВСЕХ add_header из server. Поэтому блоки статики и env.js ниже
		# не получают эти заголовки; location / наследует их.
		# Разрешаем встраивание страницы во фрейм только с того же origin.
		add_header X-Frame-Options "SAMEORIGIN" always;
		# Запрещаем браузеру угадывать MIME-тип вместо указанного сервером.
		add_header X-Content-Type-Options "nosniff" always;
		# Устаревший заголовок для старых браузеров; современные его игнорируют.
		add_header X-XSS-Protection "1; mode=block" always;
		# В пределах origin передаём полный Referer, на другой origin — только
		# origin, а при переходе с HTTPS на HTTP Referer не передаём.
		add_header Referrer-Policy "strict-origin-when-cross-origin" always;

		# Выбор location: точное совпадение (=) имеет приоритет; затем здесь
		# проверяются regex-блоки в порядке объявления, иначе используется /.
		# Аргументы запроса (?...) при выборе location не учитываются.
		# ~* означает регулярное выражение без учёта регистра.
		# Долгое кеширование подходит для файлов с хешем содержимого в имени
		# (например /assets/index-AbCd1234.js, создаваемых Vite).
		# Этот regex охватывает и файлы без хеша: при их обновлении по тому же
		# URL клиент может видеть старую версию до истечения срока кеша.
		location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
			# Добавляет Expires и Cache-Control: max-age со сроком в один год.
			expires 1y;
			# public разрешает общие кеши; immutable сообщает, что содержимое
			# по этому URL не меняется в течение срока свежести ответа.
			add_header Cache-Control "public, immutable";
			# Не записываем каждый запрос статики в журнал доступа.
			access_log off;
		}

		# Точное совпадение исключает env.js из общего правила для .js выше.
		# /env.js и /env.js?version=123 используют один и тот же блок.
		# Конфигурация может измениться без пересборки приложения.
		location = /env.js {
			# Если конфигурация не создана, возвращаем 404, а не index.html.
			try_files $uri =404;
			# Не формируем Expires/max-age с помощью директивы expires.
			# Само по себе expires off не запрещает кеширование.
			expires off;
			# Запрещаем хранение ответа в браузерных и промежуточных кешах,
			# включая ответы с ошибками (always).
			add_header Cache-Control "no-store" always;
		}

		# Обработка остальных URL, включая маршруты SPA вроде /users/42.
		location / {
			# Сначала ищем файл, затем каталог; если их нет, выполняем
			# внутреннее перенаправление на index.html. Маршрут далее может
			# обработать клиентский роутер. HTML не получает годовой кеш выше.
			try_files $uri $uri/ /index.html;
		}
	}
}
